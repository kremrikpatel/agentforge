[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Phase 1: four-agent LangGraph pipeline with LLM gateway, guardrails and three-tier memory."
requires-python = ">=3.13"

dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",          # every provider adapter; avoids four vendor SDKs
    "redis>=5.2",           # STM + semantic cache
    "psycopg[binary]>=3.2", # pgvector LTM (the vector type lives in Postgres)
    "qdrant-client>=1.12",  # RAG vector store; embedded local mode needs no server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# Cross-encoder reranking. Kept optional because sentence-transformers pulls
# torch (~2GB); rag/rerank.py falls back to a lexical reranker when absent.
rerank = [
    "sentence-transformers>=3.0",
]

[tool.setuptools]
# Flat layout with several top-level packages, so list them rather than relying
# on auto-discovery (which refuses to guess and picks up `db/` and `tests/`).
packages = ["app", "agents", "gateway", "guardrails", "memory", "rag"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
# Flat top-level packages (app, agents, gateway, memory, guardrails) resolve from
# the repo root; PEP 420 namespace packages mean no __init__.py boilerplate.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 96
target-version = "py313"
