{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentforge.fullname" . }}-web
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels: {{- include "agentforge.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "agentforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "agentforge.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "agentforge.image" (dict "ctx" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          envFrom: {{- include "agentforge.envFrom" . | nindent 12 }}
          env:
            # The console reaches the pipeline over the cluster network.
            - name: WEB_BACKEND_URL
              value: http://{{ include "agentforge.fullname" . }}-api:{{ .Values.api.service.port }}
            - name: WEB_HOST
              value: "0.0.0.0"
            - name: WEB_PORT
              value: {{ .Values.web.containerPort | quote }}
            {{- include "agentforge.derivedEnv" . | nindent 12 }}
            {{- with .Values.web.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe: {{- toYaml .Values.web.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.web.readinessProbe | nindent 12 }}
          volumeMounts: {{- include "agentforge.tmpMount" . | nindent 12 }}
      volumes: {{- include "agentforge.tmpVolume" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentforge.fullname" . }}-web
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  # Console sessions live in the pod (Phase 4 known limit), so a user must keep
  # hitting the same replica or they get logged out on every other request.
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "agentforge.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
{{- end }}
