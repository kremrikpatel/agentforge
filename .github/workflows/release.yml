# Cut a release by pushing a semver tag: git tag v0.2.0 && git push origin v0.2.0
#
#   verify  -> tag matches pyproject + Chart appVersion, tests pass
#   images  -> ghcr.io/<owner>/agentforge/{api,web,redteam,monitoring}:<version>
#   release -> chart to oci://ghcr.io/<owner>/charts, GitHub Release with wheel/sdist/chart
#
# Image paths mirror the chart's `repository: agentforge/<svc>`, so installing a
# release is just `--set image.registry=ghcr.io/<owner>`.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The chart defaults every image tag to appVersion, so a tag that disagrees
      # with it would publish v0.2.0 images while `helm install` pulls 0.1.0.
      - name: Tag matches pyproject version and Chart appVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/agentforge/Chart.yaml)
          echo "tag=$tag pyproject=$py appVersion=$app"
          if [ "$tag" != "$py" ] || [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag must equal pyproject version ($py) and Chart appVersion ($app)"
            exit 1
          fi

      - run: pip install -e ".[dev]"
      - run: pytest -q

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, redteam, monitoring]
    steps:
      # ponytail: PyRIT pulls torch (several GB); reclaiming preinstalled SDKs keeps the
      # redteam build inside a standard runner's disk. Move to a larger runner if it still fills.
      - name: Free runner disk
        if: matrix.service == 'redteam'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tags -> 0.2.0, 0.2 and latest; a pre-release (v0.2.0-rc.1) gets only its own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentforge/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build --outdir dist

      - name: Package and push Helm chart
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/agentforge --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push dist/agentforge-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${flags[@]}"
