<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentForge — Team Coordination</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#8b949e;
    --analysis:#58a6ff; --develop:#bc8cff; --test:#f0883e; --deploy:#3fb950; --warn:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:.2px; }
  h1 span { color:var(--dim); font-weight:400; }
  input,button { font:inherit; border-radius:7px; border:1px solid var(--line); }
  input { flex:1; min-width:260px; padding:9px 12px; background:#0b0f14; color:var(--ink); }
  button { padding:9px 18px; background:var(--analysis); color:#04121f; border:0;
           font-weight:640; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  main { padding:22px 24px; display:grid; gap:22px;
         grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
  @media (max-width:960px){ main { grid-template-columns:1fr; } }
  .pipeline { display:flex; align-items:stretch; gap:8px; }
  .agent { flex:1; background:var(--panel); border:1px solid var(--line);
           border-top:3px solid var(--line); border-radius:10px; padding:13px;
           min-width:0; transition:.25s; }
  .agent.active { border-top-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 6px 22px -12px var(--c); }
  .agent.done { border-top-color:var(--c); }
  .agent.error { border-top-color:var(--warn); }
  .agent h2 { font-size:13px; margin:0 0 2px; color:var(--c); }
  .agent .role { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .agent .meta { font-size:11px; color:var(--dim); margin-top:9px; }
  .agent .summary { font-size:12px; color:#c9d1d9; margin-top:8px; max-height:98px; overflow:auto; }
  .arrow { align-self:center; color:var(--line); font-size:19px; transition:.25s; }
  .arrow.lit { color:var(--deploy); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
         background:var(--line); margin-right:6px; }
  .agent.active .dot { background:var(--c); animation:pulse 1.1s infinite; }
  .agent.done .dot { background:var(--c); }
  @keyframes pulse { 50% { opacity:.25; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel h3 { margin:0; padding:11px 14px; font-size:12px; text-transform:uppercase;
              letter-spacing:.7px; color:var(--dim); border-bottom:1px solid var(--line); }
  #feed { max-height:520px; overflow:auto; padding:6px 0; }
  .msg { padding:9px 14px; border-bottom:1px solid #21262d; font-size:12.5px; }
  .msg:last-child { border-bottom:0; }
  .msg .who { font-weight:640; }
  .msg .kind { font-size:10px; padding:1px 7px; border-radius:20px; border:1px solid var(--line);
               color:var(--dim); margin-left:7px; text-transform:uppercase; letter-spacing:.5px; }
  .msg.concern { background:rgba(248,81,73,.09); }
  .msg.handoff { background:rgba(63,185,80,.07); }
  .msg .body { color:#c9d1d9; margin-top:3px; }
  pre { margin:0; padding:14px; font-size:11.5px; max-height:340px; overflow:auto; color:#a5d6ff; }
  .status { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>AgentForge <span>· agent team coordination</span></h1>
  <input id="topic" placeholder="Topic, e.g. build a rate limiter for a public API"
         value="Design a rate limiter for a public REST API" />
  <button id="go">Run pipeline</button>
  <span class="status" id="status">idle</span>
</header>

<main>
  <div style="display:grid;gap:22px;min-width:0">
    <div class="pipeline" id="pipeline"></div>
    <div class="panel">
      <h3>Team blackboard</h3>
      <div id="feed"></div>
    </div>
  </div>
  <div class="panel">
    <h3>Final report</h3>
    <pre id="report">Run the pipeline to see the contract chain.</pre>
  </div>
</main>

<script>
const STAGES = [
  { id:"analysis", name:"Ana",  role:"Analyst",            color:"var(--analysis)" },
  { id:"develop",  name:"Dev",  role:"Solution Architect", color:"var(--develop)"  },
  { id:"test",     name:"Tess", role:"QA Engineer",        color:"var(--test)"     },
  { id:"deploy",   name:"Dep",  role:"Release Engineer",   color:"var(--deploy)"   },
];

const pipeline = document.getElementById("pipeline");
const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
const reportEl = document.getElementById("report");
const goBtn = document.getElementById("go");
const cards = {};

STAGES.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = "agent";
  el.style.setProperty("--c", s.color);
  el.innerHTML = `<div class="role"><span class="dot"></span>${s.role}</div>
                  <h2>${s.name}</h2>
                  <div class="meta" data-meta>waiting</div>
                  <div class="summary" data-summary></div>`;
  pipeline.appendChild(el);
  cards[s.id] = el;
  if (i < STAGES.length - 1) {
    const a = document.createElement("div");
    a.className = "arrow"; a.textContent = "→"; a.dataset.after = s.id;
    pipeline.appendChild(a);
  }
});

const esc = t => String(t ?? "").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
const label = id => (STAGES.find(s => s.id === id) || {}).name || id;

function reset() {
  feed.innerHTML = "";
  reportEl.textContent = "running…";
  Object.values(cards).forEach(c => {
    c.className = "agent";
    c.querySelector("[data-meta]").textContent = "waiting";
    c.querySelector("[data-summary]").textContent = "";
  });
  document.querySelectorAll(".arrow").forEach(a => a.classList.remove("lit"));
}

function addMessage(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.kind || "");
  el.innerHTML = `<div><span class="who">${esc(label(m.sender))} → ${esc(label(m.recipient))}</span>
                  <span class="kind">${esc(m.kind)}</span></div>
                  <div class="body">${esc(m.content)}</div>`;
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
}

function handle(ev) {
  if (ev.type === "node_start") {
    cards[ev.stage].className = "agent active";
    cards[ev.stage].querySelector("[data-meta]").textContent = "thinking…";
    statusEl.textContent = `${label(ev.stage)} is working`;
  } else if (ev.type === "node_complete") {
    const c = cards[ev.stage];
    c.className = "agent done";
    c.querySelector("[data-meta]").textContent =
      `${ev.provider || "?"} · ${Math.round(ev.latency_ms)}ms · confidence ${ev.confidence}`;
    c.querySelector("[data-summary]").textContent = (ev.handoff || {}).summary || "";
    const arrow = document.querySelector(`.arrow[data-after="${ev.stage}"]`);
    if (arrow) arrow.classList.add("lit");
  } else if (ev.type === "node_error") {
    cards[ev.stage].className = "agent error";
    cards[ev.stage].querySelector("[data-meta]").textContent = "failed";
    addMessage({ sender:"orchestrator", recipient:ev.stage, kind:"concern", content:ev.error });
  } else if (ev.type === "team_message") {
    addMessage(ev);
  } else if (ev.type === "guardrail") {
    addMessage({
      sender:"guardrails", recipient:ev.stage || "team", kind:"concern",
      content:`${ev.action} on ${ev.direction} (risk ${ev.risk_score}) — ` +
              (ev.findings || []).map(f => `${f.tier}:${f.category}`).join(", "),
    });
  } else if (ev.type === "cache_hit") {
    statusEl.textContent = `cache hit (${ev.kind}) — no LLM call`;
  } else if (ev.type === "run_complete") {
    statusEl.textContent = `${ev.status} in ${Math.round(ev.latency_ms)}ms`;
  }
}

goBtn.onclick = async () => {
  const topic = document.getElementById("topic").value.trim();
  if (!topic) return;
  goBtn.disabled = true;
  reset();

  const runId = crypto.randomUUID().replace(/-/g, "");
  // Subscribe first so no early event is missed; the bus also replays history.
  const es = new EventSource(`/pipeline/stream/${runId}`);
  es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };

  try {
    const res = await fetch("/pipeline/run", {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify({ topic, run_id: runId }),
    });
    const report = await res.json();
    reportEl.textContent = JSON.stringify(report, null, 2);
    if (report.cached) {
      statusEl.textContent = "served from semantic cache — no LLM call";
      STAGES.forEach(s => {
        const contract = report[s.id];
        if (!contract) return;
        cards[s.id].className = "agent done";
        cards[s.id].querySelector("[data-meta]").textContent = "cached";
        cards[s.id].querySelector("[data-summary]").textContent = contract.handoff.summary;
        const arrow = document.querySelector(`.arrow[data-after="${s.id}"]`);
        if (arrow) arrow.classList.add("lit");
      });
      (report.team_messages || []).forEach(addMessage);
    }
  } catch (err) {
    statusEl.textContent = "request failed";
    reportEl.textContent = String(err);
  } finally {
    es.close();
    goBtn.disabled = false;
  }
};
</script>
</body>
</html>
